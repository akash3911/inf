services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: codetrack
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    image: codetrack-mini-backend
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/codetrack
      JWT_SECRET: devsecret
      PORT: 5000
      PISTON_API: http://piston:2000/api/v2/execute
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      piston:
        condition: service_started
  piston:
    image: ghcr.io/engineer-man/piston:latest
    privileged: true # required by isolate sandbox
    volumes:
      - piston-data:/piston
    ports:
      - "2000:2000"
  frontend:
    build: ./frontend
    image: codetrack-mini-frontend
    environment:
      VITE_API_URL: http://localhost:5000
    ports:
      - "5173:80"
    depends_on:
      - backend
volumes:
  pgdata:
  piston-data:
