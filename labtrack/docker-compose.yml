services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: labtrack
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    image: labtrack-mini-backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: labtrack
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: devsecret-devsecret-devsecret-32bytes!
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    image: labtrack-mini-frontend
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "5176:80"
    depends_on:
      - backend
volumes:
  pgdata:
