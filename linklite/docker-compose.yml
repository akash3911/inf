services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: linklite
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/linklite
      JWT_SECRET: devsecret
      BASE_URL: http://localhost:5001
      PORT: 5001
    ports:
      - "5001:5001"
    depends_on:
      - db
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:5001
    ports:
      - "5175:80"
    depends_on:
      - backend
volumes:
  pgdata:
